<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>🗺️ Карта рыболовных мест от Михалыча</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        .header { 
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white; 
            padding: 10px;
            text-align: center;
        }
        .header h1 { 
            font-size: 1.0em;
            margin-bottom: 5px; 
        }
        .header p { 
            font-size: 0.8em;
            opacity: 0.9; 
        }
        #map { 
            width: 100%; 
            height: calc(100vh - 80px);
        }
        .balloon-content {
            max-width: 300px;
            padding: 10px;
        }
        .balloon-photo {
            max-width: 100%;
            max-height: 200px;
            border-radius: 5px;
            margin-bottom: 8px;
        }
        .balloon-description {
            margin-bottom: 8px;
            line-height: 1.4;
            font-size: 14px;
        }
        .balloon-source {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            font-size: 12px;
        }
        .balloon-source a {
            color: #3498db;
            text-decoration: none;
        }
        .balloon-source a:hover {
            text-decoration: underline;
        }
        .balloon-coords {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        .anonymous-user {
            color: #666;
        }
        /* Атрибуция OpenStreetMap */
        .leaflet-control-attribution {
            background: rgba(255, 255, 255, 0.95) !important;
            padding: 5px 8px !important;
            border-radius: 3px !important;
            font-size: 10px !important;
            opacity: 1 !important;
            z-index: 1000 !important;
        }
        .leaflet-control-attribution a {
            color: #0066cc !important;
            text-decoration: none !important;
        }
        .leaflet-control-attribution a:hover {
            text-decoration: underline !important;
        }
        /* Стили для кластеров */
        .marker-cluster-small {
            background-color: rgba(181, 226, 140, 0.6);
        }
        .marker-cluster-small div {
            background-color: rgba(110, 204, 57, 0.6);
        }
        .marker-cluster-medium {
            background-color: rgba(241, 211, 87, 0.6);
        }
        .marker-cluster-medium div {
            background-color: rgba(240, 194, 12, 0.6);
        }
        .marker-cluster-large {
            background-color: rgba(253, 156, 115, 0.6);
        }
        .marker-cluster-large div {
            background-color: rgba(241, 128, 23, 0.6);
        }
        /* Кастомные иконки для рыбацких мест */
        .fishing-icon {
            background: #3498db;
            border: 2px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🗺️ Карта рыболовных мест от Михалыча</h1>
        <p>Лучшие места для рыбалки в вашем регионе.  <a href="https://t.me/mikhalych_fisherman_bot" target="_blank" style="color: white; text-decoration: underline;">Я на связи! Жми сюда!</a></p>
    </div>
    
    <div id="map"></div>

    <script type="text/javascript">
        let map;
        let markersCluster;

        // Создаем кастомную иконку для рыбацких мест
        function createFishingIcon() {
            return L.divIcon({
                className: 'fishing-icon',
                html: '🎣',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function init() {
            // Инициализация карты с центром на России и ОГРАНИЧЕНИЯМИ МАСШТАБА
            map = L.map('map', {
                minZoom: 3,    // МИНИМАЛЬНЫЙ масштаб
                maxZoom: 18,   // МАКСИМАЛЬНЫЙ масштаб
                zoomControl: true
            }).setView([55.7558, 37.6173], 5);

            // ЖЕСТКОЕ ОГРАНИЧЕНИЕ МАСШТАБА ДЛЯ TELEGRAM
            function enforceZoomLimits() {
                var currentZoom = map.getZoom();
                if (currentZoom < 3) {
                    map.setZoom(3);
                }
                if (currentZoom > 18) {
                    map.setZoom(18);
                }
            }

            // Вешаем обработчики на все события изменения масштаба
            map.on('zoomend', enforceZoomLimits);
            map.on('zoomlevelschange', enforceZoomLimits);
            map.on('viewreset', enforceZoomLimits);

            // Дополнительная защита - проверяем масштаб каждую секунду
            setInterval(enforceZoomLimits, 1000);

            // Добавляем тайлы OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
               attribution: '🎣 <a href="https://t.me/mikhalych_fisherman_bot" target="_blank" style="color: #3498db; text-decoration: none;">Михалыч Рыбак</a> | © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
                minZoom: 3,
                maxZoom: 18
            }).addTo(map);

            // Убираем "Leaflet | " из атрибуции
            map.attributionControl.setPrefix('');

            // Создаем кластер маркеров
            markersCluster = L.markerClusterGroup({
                chunkedLoading: true,
                maxClusterRadius: 50,
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: true,
                zoomToBoundsOnClick: true,
                disableClusteringAtZoom: 16
            });

            map.addLayer(markersCluster);
            loadFishingPlaces();
        }

        function loadFishingPlaces() {
            fetch('./places.json')
                .then(response => response.json())
                .then(places => {
                    places.forEach(place => {
                        const marker = L.marker(
                            [place.coords[0], place.coords[1]],
                            { icon: createFishingIcon() }
                        );

                        const popupContent = createPopupContent(place);
                        marker.bindPopup(popupContent, {
                            maxWidth: 300,
                            className: 'custom-popup'
                        });

                        markersCluster.addLayer(marker);
                    });
                })
                .catch(error => {
                    console.error('Ошибка загрузки данных:', error);
                });
        }

        function createPopupContent(place) {
            let content = '<div class="balloon-content"><div style="font-weight: bold; margin-bottom: 8px; color: #2c3e50;">🎣 Место для рыбалки</div>';

            if (place.description) {
                // Экранирование HTML для защиты от XSS
                const escapedDescription = place.description
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#x27;');
                content += '<div class="balloon-description">' + escapedDescription + '</div>';
            }

            if (place.photo_url) {
                // Безопасная вставка URL (только допустимые символы)
                const safePhotoUrl = place.photo_url.replace(/[<>"']/g, '');
                content += '<img src="' + safePhotoUrl + '" alt="Фото места" class="balloon-photo" onerror="this.style.display=\'none\'">';
            }

            if (place.source_link) {
                if (place.is_anonymous === true || place.source_link.url === "") {
                    // Анонимный пользователь (Знаток водоема)
                    const safeText = place.source_link.text
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    content += '<div class="balloon-source"><span class="anonymous-user">👤 ' + safeText + '</span></div>';
                } else {
                    // Публичный пользователь с ссылкой
                    const safeUrl = place.source_link.url.replace(/[<>"']/g, '');
                    const safeText = place.source_link.text
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    content += '<div class="balloon-source">📍 <b>Добавил:</b> <a href="' + safeUrl + '" target="_blank" style="color: #3498db;">' + safeText + '</a></div>';
                }
            }

            content += '<div class="balloon-coords"><b>Координаты:</b> ' + place.coords[0].toFixed(6) + ', ' + place.coords[1].toFixed(6) + '</div></div>';
            return content;
        }

        // Инициализация карты после загрузки страницы
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
